    <text x="232" y="0" fill="url(#chrome-grad)" font-family="'Space Grotesk', 'Chivo', sans-serif" font-size="18.5" font-weight="900" font-style="italic" letter-spacing="2.5">
      PRO COMPETITION
    </text>
