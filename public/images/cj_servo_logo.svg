    <path d="M 588 48 Q 628 48 628 83 Q 628 118 588 118 Q 548 118 548 83 Q 548 48 588 48 Z M 588 64 Q 566 64 566 83 Q 566 102 588 102 Q 610 102 610 83 Q 610 64 588 64 Z" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" />
