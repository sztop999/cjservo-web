    <path d="M 175 48 L 225 48 L 225 96 Q 225 122 195 122 L 158 122 L 158 104 L 192 104 Q 206 104 206 94 L 206 48 L 175 48 Z" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="3" />
