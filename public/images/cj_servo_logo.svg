    <path d="M 315 54 L 272 54 Q 256 54 256 68 Q 256 80 274 84 L 298 88 Q 318 92 318 104 Q 318 118 296 118 L 252 118 L 252 104 L 296 104 Q 302 104 302 98 Q 302 92 288 88 L 266 84 Q 242 78 242 66 Q 242 50 268 48 L 315 48 Z" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 330 48 L 384 48 L 384 62 L 348 62 L 348 76 L 380 76 L 380 89 L 348 89 L 348 104 L 386 104 L 386 118 L 330 118 Z" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" />
